baseURL: https://thallesgsrv.github.io/Big-O-Library/
title: Big-O-Library
locale: pt-BR
defaultContentLanguage: pt-br

theme: hextra

enableGitInfo: true

services:
  googleAnalytics:
    id: G-PJVWNC1DHT

privacy:
  googleAnalytics:
    respectDoNotTrack: true

menu:
  main:
    - name: sobre
      pageRef: /
      weight: 1
    - name: materiais
      pageRef: /docs
      weight: 2
    - name: colaboradores
      pageRef: /colaboradores
      weight: 3
    - name: como contribuir
      pageRef: /contribuir
      weight: 4
    - name: Buscar
      weight: 5
      params:
        type: search
    - name: Tema
      weight: 6
      params:
        type: theme-toggle
    - name: GitHub
      weight: 7
      url: https://github.com/thallesgsrv/Big-O-Library
      params:
        icon: github

params:
  description: O acervo acadêmico da Ciência da Computação. Materiais, referências e conteúdos de apoio organizados por disciplina e período.
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/thallesgsrv/Big-O-Library/edit/main/content
  footer:
    displayCopyright: false
    displayPoweredBy: false

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']