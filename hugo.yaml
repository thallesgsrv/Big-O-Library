baseURL: https://thallesgsrv.github.io/Big-O-Library/
title: Big-O-Library
locale: pt-BR
defaultContentLanguage: pt-br

theme: hextra

module:
  imports:
    - path: github.com/imfing/hextra
    
menu:
  main:
    - name: Conteúdo
      pageRef: /docs
      weight: 1
    - name: Buscar
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/thallesgsrv/Big-O-Library
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo-light.svg
      dark: images/logo-dark.svg
      width: 48
      height: 12
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/thallesgsrv/Big-O-Library/edit/main/content
  footer:
    displayCopyright: false
    displayPoweredBy: false

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']