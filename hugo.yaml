baseURL: https://thallesgsrv.github.io/Big-O-Library/
title: Big-O-Library
locale: pt-BR
defaultContentLanguage: pt-br

theme: hextra

# usa o histórico do Git para a data de "atualizado em" de cada página (o workflow já faz checkout completo)
enableGitInfo: true

menu:
  main:
    - name: sobre
      pageRef: /
      weight: 1
    - name: materiais
      pageRef: /docs
      weight: 2
    - name: colaboradores
      pageRef: /colaboradores
      weight: 3
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: Tema
      weight: 5
      params:
        type: theme-toggle
    - name: GitHub
      weight: 6
      url: https://github.com/thallesgsrv/Big-O-Library
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/icon-light.svg
      dark: images/icon-dark.svg
      width: 28
      height: 28
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/thallesgsrv/Big-O-Library/edit/main/content
  footer:
    displayCopyright: false
    displayPoweredBy: false

markup:
  highlight:
    noClasses: false   # usa as cores de sintaxe do tema (claro/escuro) em vez de cores fixas escuras
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']