<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" role="img" aria-label="o(library)">
  <title>o(library)</title>
  <style>
    text{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:56px;font-weight:500}
    .t{fill:#1C1B18} .ac{fill:#B45309}
    .k{opacity:0;animation-duration:12s;animation-iteration-count:infinite}
    .k1{opacity:1;animation-name:ka}
    .k2{fill:#16A34A;animation-name:kb} .k3{fill:#65A30D;animation-name:kc}
    .k4{fill:#CA8A04;animation-name:kd} .k5{fill:#EA580C;animation-name:ke}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes ka{0%,36%{opacity:1}38%,88%{opacity:0}90%,100%{opacity:1}}
    @keyframes kb{0%,38%{opacity:0}40%,50%{opacity:1}52%,100%{opacity:0}}
    @keyframes kc{0%,50%{opacity:0}52%,62%{opacity:1}64%,100%{opacity:0}}
    @keyframes kd{0%,62%{opacity:0}64%,74%{opacity:1}76%,100%{opacity:0}}
    @keyframes ke{0%,74%{opacity:0}76%,86%{opacity:1}88%,100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.k,.cur{animation:none!important}.k:not(.k1){opacity:0!important}.cur{opacity:1}}
  </style>
  <g aria-hidden="true">
    <text class="ac" x="12.96" y="64" textLength="67.2" lengthAdjust="spacing">o(</text>
    <text class="t k k1" x="80.16" y="64" textLength="235.20000000000002" lengthAdjust="spacing">library</text>
