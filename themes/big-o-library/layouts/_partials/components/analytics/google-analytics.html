{{- with site.Config.Services.GoogleAnalytics.ID }}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  window.boLoadGA = function () {
    if (window.boGAOn) return;
    window.boGAOn = true;
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id={{ . }}";
    document.head.appendChild(s);
    gtag("js", new Date());
    gtag("config", "{{ . }}", { anonymize_ip: true });
  };
  window.boDNT = navigator.doNotTrack === "1" || window.doNotTrack === "1";
  try {
    if (!window.boDNT && localStorage.getItem("bo-cookies") === "sim") window.boLoadGA();
  } catch (e) {}
</script>
{{ end -}}
