name: Publicar no GitHub Pages

# Publicação manual, como alternativa ao ./deploy.sh (que envia para a branch gh-pages).
#
# Para usar:
#   1. No repositório, vá em Settings > Pages > Build and deployment e escolha "GitHub Actions" como fonte.
#   2. Rode este workflow em Actions > "Publicar no GitHub Pages" > Run workflow.
# Enquanto a fonte do Pages for "Deploy from a branch", continue usando o ./deploy.sh e ignore este arquivo.
# Quando migrar de vez, troque "workflow_dispatch" por "push: branches: [main]" para publicar a cada merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Hugo extended
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Compilar
        run: hugo --gc --minify --environment production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
