version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Toda atualização do Tailwind muda o CSS compilado: depois de aceitar,
      # rode `npm run build:css` na branch e faça commit do main.css.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-tools:
        patterns: ["*"]
