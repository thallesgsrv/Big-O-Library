# ─────────────────────────────────────────────────────────────────────────────
#  CONSELHO DOS SÁBIOS
#  Professores que contribuíram com materiais (sem commit no repositório).
#
#  Para adicionar alguém, copie um bloco abaixo e preencha. Só "nome" é
#  obrigatório; o resto é opcional.
#
#  nome        Nome como deve aparecer
#  titulo      Título de honra (ex.: "Mestre das Recorrências")
#  disciplina  Disciplina que leciona / contribuiu
#  periodo     1 a 9. Aparece no card e define a ordem da página (1º período
#              primeiro). Optativa/outro: 0 ou apague a linha (vai para o fim)
#  frase       A frase marcante. Sem frase? Apague a linha: o card simplesmente
#              não mostra a citação e a mesa não sorteia essa pessoa.
#  cor         (opcional) 1 a 9: escolhe a cor do card na paleta do site
#              (1 = verde ... 9 = vermelho). Sem isso, as cores se alternam.
#  foto        Nome do arquivo dentro de static/images/conselho/  (ex.: ada.jpg)
#              Sem foto + com github → usa o avatar do GitHub.
#              Sem foto + sem github → mostra as iniciais.
#  github      Só o usuário (ex.: joaoarthurbm). Pode apagar a linha se não tiver.
#  id          Para quem não tem GitHub: um apelido curto, sem espaços (ex.: salatiel).
#              É a chave que liga o sábio às páginas: coloque o github (ou o id) em
#              `autores:` (escreveu) ou `baseadoEm:` (a página se baseia no material dele)
#              no front matter, e o card passa a listar essas páginas sozinho.
#  materiais   (opcional) Contribuições que ainda não são páginas do acervo. Quando
#              `autores:`/`baseadoEm:` já apontam para a pessoa, o card lista as
#              páginas sozinho e este campo é desnecessário.
#  exemplo     true = exibe a etiqueta "exemplo". Apague ao colocar dados reais.
# ─────────────────────────────────────────────────────────────────────────────
professores:
  - nome: Prof. João Arthur
    titulo: Guardião dos Algoritmos
