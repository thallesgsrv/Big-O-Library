# ─────────────────────────────────────────────────────────────────────────────
#  CONSELHO DOS SÁBIOS
#  Professores que contribuíram com materiais (sem commit no repositório).
#
#  Para adicionar alguém, copie um bloco abaixo e preencha. Só "nome" e "frase"
#  são obrigatórios.
#
#  nome        Nome como deve aparecer no card
#  titulo      Título de honra (ex.: "Mestre das Recorrências")
#  disciplina  Disciplina que leciona / contribuiu
#  periodo     1 a 9 (define a cor do card). Optativa/outro: deixe 0 ou apague
#  classe      Classe Big-O do sábio, só pela brincadeira: O(1), O(log n), O(n),
#              O(n log n), O(n²), O(2ⁿ), O(n!) ...
#  frase       A frase marcante
#  foto        Nome do arquivo dentro de static/images/conselho/  (ex.: ada.jpg)
#              Sem foto + com github → usa o avatar do GitHub.
#              Sem foto + sem github → mostra as iniciais.
#  github      Só o usuário (ex.: joaoarthurbm). Pode apagar a linha se não tiver.
#  materiais   Lista curta do que a pessoa contribuiu
#  exemplo     true = exibe a etiqueta "exemplo". APAGUE ao colocar dados reais.
# ─────────────────────────────────────────────────────────────────────────────
