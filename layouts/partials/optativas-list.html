<!-- Partial: optativas-list.html -->
<div id="optativas-list-materiais" class="bo-optativas-wrap closed" style="margin-top:8px">
  {{ $opt := site.GetPage "section" "docs/optativas" }}
  {{ if $opt }}
    <div class="bo-grid3">
      {{ range $opt.Pages }}
        <a class="bo-card" href="{{ .RelPermalink }}"><div class="bo-bar"></div><div class="bo-t">{{ .Title }}</div><div class="bo-d">{{ with .Params.description }}{{ . }}{{ else }}Material optativo{{ end }}</div></a>
      {{ end }}
    </div>
  {{ else }}
    <div class="bo-card bo-text"><div class="bo-bar"></div><div class="bo-d">Nenhuma optativa encontrada.</div></div>
  {{ end }}

  <script>
    (function(){
      var link = document.getElementById('optativas-link-materiais');
      var list = document.getElementById('optativas-list-materiais');
      if(!link || !list) return;
      link.addEventListener('click', function(e){
        e.preventDefault();
        // toggle open class for smooth transition
        var opening = list.classList.contains('closed');
        if(opening){
          list.classList.remove('closed');
          list.classList.add('open');
          link.classList.add('active');
          try{ list.scrollIntoView({behavior:'smooth', block:'start'}); }catch(err){}
        } else {
          list.classList.remove('open');
          list.classList.add('closed');
          link.classList.remove('active');
        }
      });
    })();
  </script>
</div>
