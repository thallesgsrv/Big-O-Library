<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="720" height="320" role="img" aria-label="Lazy segment tree example">
  <style>text{font-family:Inter,Arial;font-size:12px}</style>
  <rect x="20" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="40" y="116" text-anchor="middle">a0</text>
  <rect x="70" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="90" y="116" text-anchor="middle">a1</text>
  <rect x="120" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="140" y="116" text-anchor="middle">a2</text>
  <rect x="170" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="190" y="116" text-anchor="middle">a3</text>
  <rect x="95" y="20" width="80" height="24" fill="#FFF2CC" stroke="#333"/><text x="135" y="36" text-anchor="middle">sum[0-3]</text>
