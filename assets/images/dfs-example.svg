<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="400" height="240" role="img" aria-label="DFS example">
  <style>text{font-family:Inter,Arial;font-size:12px}</style>
  <!-- nodes -->
  <circle cx="40" cy="30" r="14" fill="#FFD966" stroke="#333"/>
  <text x="40" y="34" text-anchor="middle">A</text>
  <circle cx="100" cy="30" r="14" fill="#FFE7C6" stroke="#333"/>
  <text x="100" y="34" text-anchor="middle">B</text>
  <circle cx="160" cy="30" r="14" fill="#FFE7C6" stroke="#333"/>
  <text x="160" y="34" text-anchor="middle">C</text>
  <circle cx="100" cy="80" r="14" fill="#FFE7C6" stroke="#333"/>
  <text x="100" y="84" text-anchor="middle">D</text>
  <!-- edges -->
  <line x1="52" y1="30" x2="88" y2="30" stroke="#666" stroke-width="2"/>
  <line x1="112" y1="30" x2="148" y2="30" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="44" x2="100" y2="66" stroke="#666" stroke-width="2"/>
  <!-- notes -->
  <text x="10" y="110">Exemplo: ordem DFS = A → B → C → D (exemplo ilustrativo)</text>
</svg>
