<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="720" height="280" role="img" aria-label="Segment tree example">
  <style>text{font-family:Inter,Arial;font-size:12px}</style>
  <!-- leaves -->
  <rect x="20" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="40" y="116" text-anchor="middle">a0</text>
  <rect x="70" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="90" y="116" text-anchor="middle">a1</text>
  <rect x="120" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="140" y="116" text-anchor="middle">a2</text>
  <rect x="170" y="100" width="40" height="24" fill="#EFEFEF" stroke="#333"/><text x="190" y="116" text-anchor="middle">a3</text>
  <!-- internal -->
  <rect x="45" y="60" width="60" height="24" fill="#FFF2CC" stroke="#333"/><text x="75" y="76" text-anchor="middle">sum[0-1]</text>
  <rect x="140" y="60" width="60" height="24" fill="#FFF2CC" stroke="#333"/><text x="170" y="76" text-anchor="middle">sum[2-3]</text>
  <rect x="95" y="20" width="80" height="24" fill="#FFD966" stroke="#333"/><text x="135" y="36" text-anchor="middle">sum[0-3]</text>
  <!-- connectors -->
  <line x1="75" y1="84" x2="75" y2="100" stroke="#666"/>
  <line x1="170" y1="84" x2="170" y2="100" stroke="#666"/>
  <line x1="135" y1="44" x2="135" y2="60" stroke="#666"/>
  <text x="10" y="135">Segment Tree: cada nó agrega um segmento do array</text>
</svg>
