<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="720" height="400" role="img" aria-label="Backtracking tree">
  <style>text{font-family:Inter,Arial;font-size:12px}</style>
  <text x="10" y="18">Árvore de decisões (backtracking)</text>
  <circle cx="180" cy="40" r="14" fill="#E6F9D6" stroke="#333"/><text x="180" y="44" text-anchor="middle">root</text>
  <circle cx="100" cy="90" r="12" fill="#FFF2CC" stroke="#333"/><text x="100" y="94" text-anchor="middle">a</text>
  <circle cx="180" cy="90" r="12" fill="#FFF2CC" stroke="#333"/><text x="180" y="94" text-anchor="middle">b</text>
  <circle cx="260" cy="90" r="12" fill="#FFF2CC" stroke="#333"/><text x="260" y="94" text-anchor="middle">c</text>
  <line x1="180" y1="54" x2="100" y2="78" stroke="#666"/>
  <line x1="180" y1="54" x2="180" y2="78" stroke="#666"/>
  <line x1="180" y1="54" x2="260" y2="78" stroke="#666"/>
  <text x="10" y="180">Procura por permutações: explore, se falhar volte e tente próxima opção</text>
</svg>
